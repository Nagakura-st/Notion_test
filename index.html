<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notion MCP Counter</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">GitHub MCP write test</p>
      <h1>シンプルカウンター</h1>
      <output id="count" class="count" aria-live="polite">0</output>
      <div class="actions">
        <button id="increment" type="button">増やす</button>
        <button id="reset" type="button" class="secondary">リセット</button>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
